<header class="cabecalho">
  <img src="/images/logo.png" class="logo" alt="Indexa" />
  @if (!initialScreen()) {
    <div class="link">
      <a routerLink="/lista-contatos">
        <img class="seta" src="images/arrow-left.png" alt="" />
        Voltar
      </a>
    </div>
  }
  <img [src]="bannerSrc()" class="banner" alt="" />
  <h1 [class]="initialScreen() ? 'titulo' : 'titulo-form'" [innerHTML]="title()"></h1>
</header>
