<section class="contato">
  <ul>
    <img [src]="avatar()" alt="avatar" class="avatar" [routerLink]="['/perfil-contato', id()]" />
    <li>
      <strong>{{ name() }} </strong>
    </li>
    <li>{{ phone() }}</li>
    <li>
      <button [routerLink]="['/formulario', id()]">
        <img src="/images/pencil-square.png" alt="" />
      </button>
      <button [routerLink]="['/perfil-contato', id()]">
        <img src="/images/trash.png" alt="" />
      </button>
    </li>
  </ul>
</section>
