<app-container>
  <app-header [bannerSrc]="'/images/adicionar-contato.png'" [title]="'Adicionar contato'">
  </app-header>

  <form [formGroup]="contactForm" (ngSubmit)="handleSubmit()">
    <div role="button" class="imagem-contato">
      <i class="material-icons">add</i>
      <label for="avatar">Adicione a imagem do contato</label>
      <input type="file" id="avatar" accept="image/*" (change)="onSelectedFile($event)" required />
    </div>
    @if (contactForm.get('avatar')?.value) {
      <figure>
        <img [src]="contactForm.get('avatar')?.value" alt="Avatar do Contato" />
      </figure>
    }
    <label for="name">Nome</label>
    <input type="text" id="name" placeholder="Digite o nome do contato" formControlName="name" />
    <app-message-erro [control]="getControl('name')"></app-message-erro>
    <label for="phone">Telefone</label>
    <input
      type="text"
      id="phone"
      placeholder="Digite o telefone do contato"
      formControlName="phone"
    />
    <app-message-erro [control]="getControl('phone')"></app-message-erro>
    <label for="email">E-mail</label>
    <input
      type="email"
      id="email"
      placeholder="Digite o e-mail do contato"
      formControlName="email"
    />
    <app-message-erro [control]="getControl('email')"></app-message-erro>

    <label for="birthday">Aniversário</label>
    <input type="date" id="birthday" placeholder="Data de nascimento" formControlName="birthday" />
    <app-message-erro [control]="getControl('birthday')"></app-message-erro>

    <label for="social">Rede Sociais</label>
    <div class="input-container">
      <span class="span-http">http://</span>
      <input
        type="text"
        id="social"
        placeholder="Adicione a URL da página"
        formControlName="social"
      />
    </div>
    <app-message-erro [control]="getControl('social')"></app-message-erro>
    <label for="observations">Observações</label>
    <textarea
      id="observations"
      placeholder='Coloque observações nesse espaço. Exemplo: "Instrutora da academia "Nova imagem", amiga da Júlia'
      formControlName="observations"
    ></textarea>
    <app-message-erro [control]="getControl('observations')"></app-message-erro>
    <section class="botoes">
      <button class="botao-cancelar" type="button" (click)="cancel()">Cancelar</button>
      <button
        [disabled]="contactForm.invalid"
        [ngClass]="contactForm.valid ? 'botao-salvar' : 'botao-desabilitado'"
        class="botao-salvar"
        type="submit"
      >
        Salvar contato
      </button>
    </section>
  </form>
</app-container>
