<app-container>
  <app-header [bannerSrc]="'/images/perfil-contato.png'" [title]="'Perfil do contato'">
  </app-header>

  <section class="perfil">
    <div class="imagem-perfil">
      <img [src]="contact().avatar" alt="Avatar do contato" />
      <h2>
        <strong>{{ contact().name }}</strong>
      </h2>
    </div>
    <app-divider></app-divider>
    <ul>
      <li>
        <i class="material-icons">call</i>
        <strong>Telefone</strong>
      </li>
      <li>{{ contact().phone }}</li>
      <li>
        <i class="material-icons">mail</i>
        <strong>Email</strong>
      </li>
      <li>{{ contact().email }}</li>
      <li>
        <i class="material-icons">event_available</i>
        <strong>Data de nascimento</strong>
      </li>
      <li>{{ contact().birthday }}</li>
      <li>
        <i class="material-icons">language</i>
        <strong>Redes sociais</strong>
      </li>
      <li>{{ contact().social }}</li>
    </ul>
    <div class="botoes">
      <button class="botao-excluir" (click)="delete()">Excluir contato</button>
      <button class="botao-editar" [routerLink]="['/formulario', contact().id]">Editar</button>
    </div>
  </section>
</app-container>
